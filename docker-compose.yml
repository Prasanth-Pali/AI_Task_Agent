services:
  ai-task-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-task-agent
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
      - "4200:4200"
    restart: unless-stopped
